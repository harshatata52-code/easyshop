{% extends 'base.html' %}{% block content %}<h1>Admin Dashboard ⚙️</h1><div class="form wideForm"><h2>Add Product</h2><form method="post" action="/admin/add"><input name="name" placeholder="Name" required><input name="price" type="number" step=".01" placeholder="Price" required><input name="old_price" type="number" step=".01" placeholder="Old price"><input name="category" placeholder="Category" required><input name="image" placeholder="Image URL" required><input name="description" placeholder="Description"><input name="stock" type="number" value="10"><label><input type="checkbox" name="featured"> Featured</label><button>Add Product</button></form></div><h2>Products</h2><table><tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th></th></tr>{% for p in products %}<tr><td><img class="thumb" src="{{p.image}}"></td><td>{{p.name}}</td><td>₹{{p.price}}</td><td>{{p.stock}}</td><td><a href="/admin/delete/{{p.id}}">Delete</a></td></tr>{% endfor %}</table><h2>Orders</h2><table><tr><th>Order</th><th>User</th><th>Total</th><th>Status</th></tr>{% for o in orders %}<tr><td>#{{o.id}}</td><td>{{o.name}}</td><td>₹{{o.total}}</td><td><form class="inline" method="post" action="/admin/status/{{o.id}}"><select name="status">{% for s in ['Placed','Packed','Shipped','Delivered','Cancelled'] %}<option {% if o.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button>Save</button></form></td></tr>{% endfor %}</table>{% endblock %}
