{% extends 'base.html' %}{% block content %}<h1>Wishlist ♡</h1><div class="grid">{% for p in products %}<div class="card"><img src="{{p.image}}"><div><h3>{{p.name}}</h3><b>₹{{'%.0f'|format(p.price)}}</b><p><a class="btn" href="/add/{{p.id}}">Add to Cart</a> <a href="/wishlist/toggle/{{p.id}}">Remove</a></p></div></div>{% else %}<div class="empty"><h2>No wishlist items</h2><a class="btn" href="/">Browse Products</a></div>{% endfor %}</div>{% endblock %}
